name: Deploy to Cloudflare Pages

# The Pages project `blog-iankitkumar-in` has no Git integration, so the
# deploy is a direct upload from CI. The API token lives in the repo
# secrets and needs "Cloudflare Pages: Edit" on this account.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=blog-iankitkumar-in \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$GITHUB_COMMIT_MESSAGE"
